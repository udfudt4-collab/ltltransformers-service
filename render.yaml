# Render Blueprint Specification
# See https://render.com/docs/blueprint-spec for details

services:
  # Option A: Web Service (Runs via our Dockerfile on Free Tier)
  - type: web
    name: ltl-transformer-portal
    env: docker
    plan: free
    region: singapore # Singapore region for lowest latency
    healthCheckPath: /
    autoDeploy: true

