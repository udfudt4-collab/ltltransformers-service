<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="20" y1="12" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Shield Background -->
  <path d="M32 4L10 12V28C10 43.2 19.4 56.5 32 60C44.6 56.5 54 43.2 54 28V12L32 4Z" fill="url(#shieldGrad)" />
  <path d="M32 4L10 12V28C10 43.2 19.4 56.5 32 60C44.6 56.5 54 43.2 54 28V12L32 4Z" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Transformer Grid Rings -->
  <circle cx="32" cy="30" r="16" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4" />
  <circle cx="32" cy="30" r="11" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />

  <!-- High-Voltage Energy Lightning Bolt -->
  <path d="M35 14L23 32H33L29 50L43 28H33L35 14Z" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
